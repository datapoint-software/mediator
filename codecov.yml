# CI enforces 100% line coverage. Codecov also counts partially covered branches, which vary with test timing,
# so its checks are informational only.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - tests
  - benchmarks

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
