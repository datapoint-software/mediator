# git-cliff configuration: generates CHANGELOG.md and release notes from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to the Datapoint.Mediator packages are documented in this file.

The format is based on [Keep a Changelog 1.1.0](https://keepachangelog.com/en/1.1.0/), and the packages follow \
[Semantic Versioning 2.0.0](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version }}](https://github.com/datapoint-software/mediator/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/datapoint-software/mediator/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Tags have no prefix, such as 4.0.0-alpha.1.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only order the sections; they are removed from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(build|ci|test|chore|style|refactor)", skip = true },
]
# Breaking changes are always listed, even when their type is otherwise skipped.
protect_breaking_commits = true
